# Prefix: Ctrl-a instead of Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support (pane selection/resize, scroll, copy-mode entry)
set -g mouse on

# Split panes with | (vertical split) and - (horizontal split),
# keeping the new pane's cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Make emacsclient -nw usable: low escape-time avoids Meta-key lag,
# xterm-keys lets it see modified keys (e.g. C-arrow) correctly
set -sg escape-time 10
setw -g xterm-keys on

# Truecolor support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Sixel image support (Ghostty, foot)
set -as terminal-features "xterm-ghostty:sixel"
set -as terminal-features "foot:sixel"

# Let programs bypass tmux to reach the outer terminal directly, needed
# for the kitty graphics protocol (Ghostty supports it; foot does not)
set -g allow-passthrough on
