# Prefix: Ctrl-a instead of Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support (pane selection/resize, scroll, copy-mode entry)
set -g mouse on

# Make emacsclient -nw usable: low escape-time avoids Meta-key lag,
# xterm-keys lets it see modified keys (e.g. C-arrow) correctly
set -sg escape-time 10
setw -g xterm-keys on

# Truecolor support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
